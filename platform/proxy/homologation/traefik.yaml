global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  websecure:
    address: ":8443"
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "::1/128"

providers:
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: false

api:
  dashboard: false

ping:
  entryPoint: websecure

log:
  level: INFO
  format: common
