http:
  routers:
    activation-public:
      entryPoints:
        - web
      rule: Path(`/v1/activation-validations`) || Path(`/v1/registrations`)
      priority: 100
      middlewares:
        - activation-security
      service: backend

    backend:
      entryPoints:
        - web
      rule: PathPrefix(`/`)
      priority: 1
      middlewares:
        - security-headers
      service: backend

  middlewares:
    activation-security:
      chain:
        middlewares:
          - security-headers
          - activation-rate-limit
          - activation-body-limit

    activation-rate-limit:
      rateLimit:
        average: 100
        period: 15m
        burst: 100

    activation-body-limit:
      buffering:
        maxRequestBodyBytes: 1024
        memRequestBodyBytes: 1024

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: >-
          default-src 'none'; base-uri 'none'; object-src 'none';
          frame-ancestors 'none'; form-action 'none'
        permissionsPolicy: >-
          camera=(), microphone=(), geolocation=(), payment=(), usb=()
        customResponseHeaders:
          Cache-Control: no-store
          X-Robots-Tag: noindex, nofollow

  services:
    backend:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://host.docker.internal:8081
